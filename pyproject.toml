[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "usq-research"
version = "1.0.0"
description = "US equity factor research, walk-forward XGBoost and risk attribution"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "xgboost==3.1.3", "PyYAML>=6,<7", "plotly>=5.24,<8", "pyarrow>=16,<27"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
usq = "usq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
