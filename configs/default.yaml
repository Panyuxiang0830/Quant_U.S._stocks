# Relative paths resolve from the working directory. Run from repository root.
data_dir: data/panels
factor_dir: runs/mining/factors
run_dir: runs
label:
  mode: vwap_compound
  horizon: 10
  standardize: true
mining:
  fields: [open, high, low, close, volume, returns, vwap]
  windows: [5, 10, 20, 60, 120]
  time_periods: [1, 5, 10]
  complexity: 3
  dimension_filter: [unitless, percentage]
  required_fields: []
  max_workers: 8
  batch_size: 64
  start_method: auto
  additional_field_dimensions:
    volume: volume
    returns: percentage
  seed_factor_dir: null
  seed_factors: []
  seeds:
    - rank(close/open-1)
    - rank((close-vwap)/vwap)
    - rank(ts_corr(rank(volume),rank(returns),10))
  max_trials: 5000
  top_k: 100
  min_abs_rankic: 0.01
  min_coverage: 0.6
  min_stocks: 30
  seed: 2964
evaluation:
  min_stocks: 30
  groups: 10
  correlation_date_step: 10
  correlation_stock_fraction: 0.25
  correlation_min_pairs: 100
  correlation_threshold: 0.7
selection:
  min_validation_rankic: 0.0
  min_validation_coverage: 0.6
  min_monotonicity: 0.0
  min_net_sharpe: 0.0
model:
  objective: reg:squarederror
  max_depth: 7
  learning_rate: 0.03
  n_estimators: 500
  subsample: 1.0
  colsample_bytree: 1.0
  gamma: 0.1
  reg_lambda: 1.0
  eval_metric: rmse
  tree_method: hist
  device: cuda
  max_bin: 256
  missing: null
  seed: 2964
  nthread: 48
backtest:
  top_n: 100
  cost_bps: 5.0
  borrow_bps_annual: 300.0
  groups: 50

barra:
  model_dir: runs/barra_model
  start: '20220101'
  end: '20251231'
  min_obs: 30
  descriptor_dir: null
